name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./backend/mvnw -B -f backend/pom.xml verify
      - run: python3 -m unittest discover -s scripts -p test_usda_import.py
      - run: python3 scripts/evaluate.py backend/target/nutrilog-agent-1.0.0.jar --suite all
      - name: Verify Compose
        run: |
          docker compose up --build -d
          curl --retry 30 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8080/api/v1/health
          python3 scripts/evaluate.py --url http://127.0.0.1:8080 --suite all
      - name: Print container logs
        if: failure()
        run: docker compose logs
      - name: Stop Compose
        if: always()
        run: docker compose down
