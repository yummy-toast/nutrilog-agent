spring:
  application:
    name: nutrilog-agent
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
server:
  address: 127.0.0.1
  port: 8080

# 本地HTTP开发；部署HTTPS时需启用secure cookie。登录状态在服务端保存。
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
